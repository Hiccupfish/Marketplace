<nav class="navbar">
  <!-- Brand -->
  <div class="navbar__brand" routerLink="/home">
    {{ brand }}
  </div>

  <!-- Search -->
  <div class="navbar__search">
    <input
      type="text"
      placeholder="Search services, products, local providers..."
      [(ngModel)]="searchQuery"
      (keyup.enter)="onSearch()"
    />
  </div>

  <!-- Links -->
  <div class="navbar__links">
    <a routerLink="/home">Home</a>
    <a routerLink="/providers">Providers &amp; Businesses</a>
    <a routerLink="/products">Products</a>
    <a routerLink="/services">Services</a>
    <a routerLink="/requests">Requests</a>
    <a routerLink="/deliveries">Deliveries</a>
  </div>

  <!-- Auth -->
  <div class="navbar__auth">
    <button *ngIf="!isLoggedIn" routerLink="/auth/login">
      Login
    </button>

    <button *ngIf="!isLoggedIn" routerLink="/auth/register">
      Register
    </button>

    <div *ngIf="isLoggedIn" class="navbar__profile">
      <a routerLink="/dashboard/profile-settings" class="dashboard-link">Seller Studio</a>
      <span>{{ userName }}</span>
      <button type="button" (click)="logout()">Logout</button>
    </div>
  </div>
</nav>
