<section class="products-page">
  <header class="products-page__header">
    <div>
      <p class="eyebrow">Kasiverse</p>
      <h1>Products in South Africa</h1>
      <p class="subtitle">
        Browse local listings from verified sellers across the country.
      </p>
    </div>
    <a routerLink="/listings/create" class="create-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Post a Product
    </a>
  </header>

  <div *ngIf="isLoading" class="state">
    Loading products...
  </div>

  <div *ngIf="errorMessage" class="state state--error">
    {{ errorMessage }}
  </div>

  <div *ngIf="!isLoading && !errorMessage && listings.length === 0" class="state">
    No products are available right now.
  </div>

  <div
    *ngIf="!isLoading && !errorMessage && listings.length > 0"
    class="products-grid">

    <app-listing-card
      *ngFor="let listing of listings"
      [listing]="listing">
    </app-listing-card>

  </div>
</section>
