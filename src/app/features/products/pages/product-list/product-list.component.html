<section class="products-page">
  <header class="products-page__header">
    <div>
      <p class="eyebrow">Marketplace</p>
      <h1>Products in South Africa</h1>
      <p class="subtitle">
        Browse local listings from verified sellers across the country.
      </p>
    </div>
  </header>

  <div *ngIf="isLoading" class="state">
    Loading products...
  </div>

  <div *ngIf="errorMessage" class="state state--error">
    {{ errorMessage }}
  </div>

  <div *ngIf="!isLoading && !errorMessage && listings.length === 0" class="state">
    No products are available right now.
  </div>

  <div
    *ngIf="!isLoading && !errorMessage && listings.length > 0"
    class="products-grid">

    <app-listing-card
      *ngFor="let listing of listings"
      [listing]="listing">
    </app-listing-card>

  </div>
</section>
