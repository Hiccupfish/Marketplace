<section class="featured-listings">

  <div class="featured-listings__container">

    <div class="featured-listings__header">

      <p class="eyebrow">FEATURED MARKETPLACE</p>

      <h2>Featured Listings</h2>

      <p class="featured-listings__description">
        Discover trusted local businesses, skilled artisans and verified sellers recommended in your community.
      </p>

    </div>

    <!-- Error State -->
    <div *ngIf="error" class="error-banner">
      <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <div class="error-text">
        <h3>Could not load listings</h3>
        <p>{{ error }}</p>
      </div>
      <button class="retry-btn" (click)="loadListings()">Retry</button>
    </div>

    <!-- Skeleton Loading -->
    <div class="featured-listings__grid skeleton-grid" *ngIf="loading">
      <div class="skeleton-card" *ngFor="let item of [1,2,3]">
        <div class="skeleton-image"></div>
        <div class="skeleton-body">
          <div class="skeleton-line title"></div>
          <div class="skeleton-line price"></div>
          <div class="skeleton-line text"></div>
        </div>
      </div>
    </div>

    <!-- Listings Grid -->
    <div class="featured-listings__grid" *ngIf="!loading && !error">
      <app-listing-card
        *ngFor="let listing of featuredListings"
        [listing]="listing">
      </app-listing-card>
    </div>

  </div>

</section>
